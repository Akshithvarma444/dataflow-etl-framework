name: dataflow

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Loopback only: the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      # PostgreSQL 18 images keep data under a versioned subdirectory, so the
      # volume mounts at /var/lib/postgresql, not /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  pipeline:
    build: .
    # A batch job, not a daemon: `docker compose up -d` starts only the database,
    # and `docker compose run --rm pipeline --dataset olist` runs a pipeline.
    profiles: ["job"]
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs

volumes:
  pgdata:
