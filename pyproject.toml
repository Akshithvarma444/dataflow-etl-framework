[project]
name = "dataflow-etl-framework"
version = "0.1.0"
description = "A reusable, metadata-driven Python ETL framework with data quality checks, idempotency, monitoring, and reconciliation."
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: requires the PostgreSQL test database (docker compose up -d db)",
]

[tool.coverage.run]
source = ["src"]
branch = true
